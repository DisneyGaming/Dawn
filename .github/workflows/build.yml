name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Release
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Release DLL
      shell: cmd
      run: >
        msbuild Dawn/Dawn.vcxproj 
        /p:Configuration=Release 
        /p:Platform=x64 
        /p:PreferredToolArchitecture=x64 
        /p:CL_MPCount=2 
        /m:2 
        /v:minimal 
        /nologo

    - name: Package Release
      shell: powershell
      run: |
        $version = "0.1.${{ github.run_number }}"
        .\tools\install\New-DawnRelease.ps1 -Release $version

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dawn-windows-release
        path: |
          build\releases\Dawn-0.1.${{ github.run_number }}.zip

  build-linux:
    name: Linux (${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang llvm lld

    - name: Build Dawn
      run: ./dawn-dev.sh --build-only --config ${{ matrix.config }} --accept-license
      env:
        XWIN_ACCEPT_LICENSE: "1"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dawn-linux-${{ matrix.config }}
        path: build/linux-x64/${{ matrix.config }}/artifacts/*/steam_api64.dll
