name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-dll:
    name: Build DLL
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Release DLL
      shell: cmd
      run: >
        msbuild Dawn/Dawn.vcxproj 
        /p:Configuration=Release 
        /p:Platform=x64 
        /p:PreferredToolArchitecture=x64 
        /p:CL_MPCount=2 
        /m:2 
        /v:minimal 
        /nologo

    - name: Package Release
      shell: powershell
      run: |
        $version = "0.1.${{ github.run_number }}"
        .\tools\install\New-DawnRelease.ps1 -Release $version

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dawn-windows-release
        path: |
          build\releases\Dawn-0.1.${{ github.run_number }}.zip